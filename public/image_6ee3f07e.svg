<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="50%" stop-color="#0a0d18" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26c6da" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)" />

  <!-- Background Glow Nodes -->
  <circle cx="200" cy="300" r="160" fill="#26c6da" opacity="0.08" filter="url(#blurFilter)" />
  <circle cx="600" cy="320" r="220" fill="#6366f1" opacity="0.09" filter="url(#blurFilter)" />
  <circle cx="1000" cy="300" r="180" fill="#a855f7" opacity="0.08" filter="url(#blurFilter)" />

  <!-- Title Header -->
  <text x="600" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="1">AETHER WORKSPACE ARCHITECTURE</text>
  <text x="600" y="110" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">Modular Extensibility Matrix: Plugins · Skills · Agents · MCP Servers · Hooks</text>

  <!-- Central Hub: Aether IDE Engine Core -->
  <rect x="475" y="240" width="250" height="180" rx="20" fill="#0f172a" stroke="url(#neonGlow)" stroke-width="2.5" />
  <circle cx="600" cy="300" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="600" y="307" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">▲</text>
  <text x="600" y="360" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">AETHER ENGINE</text>
  <text x="600" y="382" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Autonomous Core v2.0</text>

  <!-- Connector Lines from Central Core to satellite modules -->
  <g stroke="url(#neonGlow)" stroke-width="2" stroke-dasharray="6,4" opacity="0.6">
    <line x1="475" y1="280" x2="330" y2="180" />
    <line x1="475" y1="360" x2="330" y2="440" />
    <line x1="725" y1="280" x2="870" y2="180" />
    <line x1="725" y1="360" x2="870" y2="440" />
    <line x1="600" y1="240" x2="600" y2="160" />
    <line x1="600" y1="420" x2="600" y2="500" />
  </g>

  <!-- Node 1: MCP SERVERS (Top Left) -->
  <rect x="130" y="130" width="220" height="110" rx="14" fill="#0d111c" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="150" y="165" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">🌐 MCP Servers</text>
  <text x="150" y="190" fill="#cbd5e1" font-family="monospace" font-size="11">• PostgreSQL / Supabase</text>
  <text x="150" y="210" fill="#cbd5e1" font-family="monospace" font-size="11">• GitHub &amp; Linear API</text>

  <!-- Node 2: PLUGINS & EXTENSIONS (Bottom Left) -->
  <rect x="130" y="390" width="220" height="110" rx="14" fill="#0d111c" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="150" y="425" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="700">🔌 Plugins System</text>
  <text x="150" y="450" fill="#cbd5e1" font-family="monospace" font-size="11">• VS Code Extension ABI</text>
  <text x="150" y="470" fill="#cbd5e1" font-family="monospace" font-size="11">• Custom LSP / Rust Analyzers</text>

  <!-- Node 3: AI SKILLS (Top Center) -->
  <rect x="490" y="90" width="220" height="85" rx="14" fill="#0d111c" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="600" y="125" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">💡 Specialized Skills</text>
  <text x="600" y="150" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">SQL, Spring Boot, React, DevOps</text>

  <!-- Node 4: AUTONOMOUS AGENTS (Top Right) -->
  <rect x="850" y="130" width="220" height="110" rx="14" fill="#0d111c" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="870" y="165" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="700">🤖 Studio Mode Agent</text>
  <text x="870" y="190" fill="#cbd5e1" font-family="monospace" font-size="11">• Multi-file Diff Generation</text>
  <text x="870" y="210" fill="#cbd5e1" font-family="monospace" font-size="11">• Self-Healing Test Runner</text>

  <!-- Node 5: HOOKS & AUTOMATIONS (Bottom Right) -->
  <rect x="850" y="390" width="220" height="110" rx="14" fill="#0d111c" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="870" y="425" fill="#ec4899" font-family="sans-serif" font-size="14" font-weight="700">🪝 Lifecycle Hooks</text>
  <text x="870" y="450" fill="#cbd5e1" font-family="monospace" font-size="11">• Pre-commit Linter Checks</text>
  <text x="870" y="470" fill="#cbd5e1" font-family="monospace" font-size="11">• Automatic Test Matrix Loop</text>

  <!-- Node 6: MODEL GATEWAY (Bottom Center) -->
  <rect x="450" y="490" width="300" height="85" rx="14" fill="#0d111c" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="600" y="525" fill="#06b6d4" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚡ Dual Model Gateway</text>
  <text x="600" y="550" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Cloud Frontier (Claude/GPT) + Local Ollama</text>

  <!-- Bottom Badge -->
  <text x="600" y="635" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">RFC 7636 PKCE · Zero Telemetry Enclave · Sub-50ms Local Execution</text>
</svg>
